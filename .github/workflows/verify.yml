name: Verify

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # All provider calls in this job are mocked. Never pass billing credentials.
      XAI_API_KEY: ''
      OPEN_MINT_X_BEARER_TOKEN: ''
      OPEN_MINT_TEST_HTTP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
      - name: Install locked dependencies
        run: npm ci
      - name: Verify renderer and slogan locks
        run: npm run renderer:verify
      - name: Check types
        run: npm run typecheck
      - name: Test with coverage ratchet and real loopback HTTP
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Test contracts offline
        run: npm run test:contract
      - name: Verify deployment manifest tooling
        run: |
          npm run test:manifest
          npm run test:manifest:roles
