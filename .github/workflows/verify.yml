name: Verify

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # All provider calls in this job are mocked. Never pass billing credentials.
      XAI_API_KEY: ''
      OPEN_MINT_X_BEARER_TOKEN: ''
      OPEN_MINT_TEST_HTTP: '1'
      OPEN_MINT_TEST_POSTGRES: '1'
      OPEN_MINT_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.5.1
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated database test binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Verify renderer and slogan locks
        run: npm run renderer:verify
      - name: Check types
        run: npm run typecheck
      - name: Test with coverage ratchet and real loopback HTTP
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Test contracts offline
        run: npm run test:contract
      - name: Verify deployment manifest tooling
        run: |
          npm run test:manifest
          npm run test:manifest:roles
          npm run test:open:manifest
      - name: Rehearse fixture mint on isolated Anvil
        shell: bash
        run: |
          export NODE_ENV=development
          export PORT=3021 OPEN_MINT_RPC_PORT=18561
          export OPEN_MINT_ORIGIN=http://127.0.0.1:3021
          export OPEN_MINT_DATA_DIR=.local/open-mint/ci-fixture
          node --import tsx src/main.ts --fixture --local-chain > "$RUNNER_TEMP/open-mint-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill -TERM "$fixture_pid" 2>/dev/null || true; wait "$fixture_pid" || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 1 "$OPEN_MINT_ORIGIN/" >/dev/null; then ready=1; break; fi
            kill -0 "$fixture_pid" || { cat "$RUNNER_TEMP/open-mint-fixture.log"; exit 1; }
            sleep 1
          done
          test "$ready" = 1 || { cat "$RUNNER_TEMP/open-mint-fixture.log"; exit 1; }
          OPEN_MINT_TEST_ORIGIN="$OPEN_MINT_ORIGIN" npm run open:rehearsal -- --execute-local-test-transactions
